name: Build and Deploy Pygbag PWA
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pygbag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build WebAssembly App
        run: |
          python -m pip install pygbag
          python -m pygbag --build .
          
      # FIX: Move files out of the Pygbag subfolder into the root of build/web
      - name: Prepare Web Deployment Folder
        run: |
          if [ -d "build/web/Hello-Justin" ]; then
            mv build/web/Hello-Justin/* build/web/
            rm -rf build/web/Hello-Justin
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web

